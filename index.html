<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 - 徐勇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a4a 25%, #0c0c3a 50%, #1a1a4a 75%, #0a0a2a 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 星空背景 */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Coze 聊天容器 - 全屏居中 */
        #coze-chat-container {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div id="stars"></div>

    <!-- Coze 聊天容器 -->
    <div id="coze-chat-container"></div>

    <script>
        // ============================================================
        // 星空效果
        // ============================================================
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                
                starsContainer.appendChild(star);
            }
        }

        // ============================================================
        // 初始化
        // ============================================================
        window.addEventListener('load', () => {
            // 创建星空
            createStars();
            
            // 初始化 Coze 聊天窗口
            new CozeChatSDK.Chat({
                botId: '7634906073757319183',
                title: 'AI 聊天助手',
                container: document.getElementById('coze-chat-container'),
                layout: 'pc',
                width: '100%',
                login: false,
            });
            
            console.log('%c🤖 AI 聊天已启动', 'color: #4a9eff; font-size: 18px; font-weight: bold;');
        });
    </script>

    <!-- Coze 聊天 SDK -->
    <script src="https://lf-cdn.coze.cn/obj/univer-cn/coze-sdk/v1.1.0/chat-sdk.min.js"></script>
</body>
</html>
