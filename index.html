<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 - 徐勇</title>
    <!-- Coze 聊天 SDK -->
    <script src="https://lf-cdn.coze.cn/obj/univer-cn/coze-sdk/v1.1.0/chat-sdk.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a4a 25%, #0c0c3a 50%, #1a1a4a 75%, #0a0a2a 100%);
            color: white;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 星空背景 */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            50% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(100, 150, 255, 0.6); }
        }

        /* 聊天界面容器 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ========== 聊天标题 ========== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(100, 150, 255, 0.3);
        }

        .chat-header-left {
            text-align: left;
        }

        .chat-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #4a9eff, #a0c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .chat-subtitle {
            font-size: 0.9rem;
            color: #b0b0ff;
            font-weight: 300;
        }

        .clear-button {
            padding: 10px 20px;
            background: rgba(255, 80, 80, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 80, 80, 0.3);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Exo 2', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .clear-button:hover {
            background: rgba(255, 80, 80, 0.25);
            border-color: rgba(255, 80, 80, 0.5);
            transform: translateY(-1px);
        }

        .clear-button:active {
            transform: translateY(0);
        }

        /* ========== 聊天消息区域 ========== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #4a9eff, #2a7aff);
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 15px rgba(74, 158, 255, 0.3);
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(40, 40, 80, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-bottom-left-radius: 5px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .message-sender {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .user-message .message-sender {
            color: #ffffff;
        }

        .ai-message .message-sender {
            color: #a0c8ff;
        }

        .message-content {
            font-size: 1rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 8px;
            text-align: right;
        }

        /* ========== 输入区域 ========== */
        .chat-input-container {
            display: flex;
            gap: 15px;
            padding: 20px;
            background: rgba(20, 20, 50, 0.7);
            border-radius: 15px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            backdrop-filter: blur(10px);
            margin-top: auto;
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(30, 30, 70, 0.8);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: 'Exo 2', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.2);
        }

        .chat-input::placeholder {
            color: #8888cc;
        }

        .send-button {
            padding: 0 30px;
            background: linear-gradient(135deg, #4a9eff, #2a7aff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Exo 2', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 100px;
        }

        .send-button:hover {
            background: linear-gradient(135deg, #2a7aff, #4a9eff);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 158, 255, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            color: #8888cc;
            opacity: 0.7;
            margin-top: 8px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .chat-container {
                padding: 10px;
            }
            
            .chat-title {
                font-size: 1.8rem;
            }
            
            .chat-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .chat-header-left {
                text-align: center;
            }
            
            .message {
                max-width: 90%;
            }
            
            .chat-input-container {
                padding: 15px;
                gap: 10px;
            }
            
            .send-button {
                padding: 0 20px;
                min-width: 80px;
            }
        }

        @media (max-width: 480px) {
            .chat-title {
                font-size: 1.4rem;
            }
            
            .chat-subtitle {
                font-size: 0.8rem;
            }
            
            .message {
                max-width: 95%;
                padding: 12px 15px;
            }
            
            .chat-input {
                padding: 12px 15px;
            }
        }

        /* ========== 滚动条 ========== */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(20, 20, 50, 0.3);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(100, 150, 255, 0.5);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 150, 255, 0.7);
        }

        /* 鼠标跟随光点 */
        .cursor-light {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 150, 255, 0.8) 0%, rgba(100, 150, 255, 0) 70%);
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        /* 错误消息 */
        .error-message {
            align-self: center;
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.4);
            border-radius: 12px;
            padding: 12px 20px;
            color: #ff6b6b;
            font-size: 0.9rem;
            text-align: center;
            max-width: 90%;
        }

        /* 思考中动画 */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            background: #a0c8ff;
            border-radius: 50%;
            animation: thinkingBounce 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(1) { animation-delay: 0s; }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinkingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div id="stars"></div>
    
    <!-- 鼠标跟随光点 -->
    <div class="cursor-light" id="cursorLight"></div>

    <!-- 聊天界面 -->
    <div class="chat-container">

        <!-- ===== 聊天标题 ===== -->
        <div class="chat-header">
            <div class="chat-header-left">
                <h1 class="chat-title">AI 聊天</h1>
                <p class="chat-subtitle">由徐勇构建</p>
            </div>
        </div>

        <!-- ===== 聊天消息区域 ===== -->
        <div class="chat-messages" id="chatMessages">
            <!-- 初始欢迎消息 - 由 JavaScript 动态生成 -->
        </div>

        <!-- ===== 输入区域 ===== -->
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="messageInput" placeholder="输入您的消息..." autocomplete="off">
            <button class="send-button" id="sendButton">发送</button>
        </div>

        <div class="footer">
            <p>© 2024 徐勇 · 按 Enter 发送消息</p>
        </div>
    </div>

    <!-- 放置聊天窗口的容器 -->
    <div id="coze-chat-container" style="width: 100%; height: 600px;"></div>

    <script>
        // ============================================================
        // DOM 元素
        // ============================================================
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        // ============================================================
        // 星空效果
        // ============================================================
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                
                starsContainer.appendChild(star);
            }
        }

        // ============================================================
        // 鼠标跟随光点效果
        // ============================================================
        const cursorLight = document.getElementById('cursorLight');
        let mouseX = 0, mouseY = 0, lightX = 0, lightY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateCursorLight() {
            lightX += (mouseX - lightX) * 0.1;
            lightY += (mouseY - lightY) * 0.1;
            cursorLight.style.left = `${lightX}px`;
            cursorLight.style.top = `${lightY}px`;
            requestAnimationFrame(updateCursorLight);
        }

        // ============================================================
        // 聊天功能
        // ============================================================

        function getCurrentTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessage(content, isUser = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            
            const sender = isUser ? '您' : 'AI 助手';
            const time = getCurrentTime();
            
            messageDiv.innerHTML = `
                <div class="message-sender">${sender}</div>
                <div class="message-content">${escapeHtml(content)}</div>
                <div class="message-time">${time}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function showThinking() {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai-message';
            thinkingDiv.id = 'thinkingMessage';
            thinkingDiv.innerHTML = `
                <div class="message-sender">AI 助手</div>
                <div class="thinking-indicator">
                    <span>正在思考</span>
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                </div>
            `;
            chatMessages.appendChild(thinkingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeThinking() {
            const thinkingDiv = document.getElementById('thinkingMessage');
            if (thinkingDiv) thinkingDiv.remove();
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = `❌ ${message}`;
            chatMessages.appendChild(errorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============================================================
        // 发送消息
        // ============================================================
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) {
                return;
            }

            // 添加用户消息
            addMessage(message, true);
            
            // 清空输入框
            messageInput.value = '';
            messageInput.focus();
            
            // 禁用发送按钮
            sendButton.disabled = true;
            sendButton.textContent = '思考中...';
            
            // 显示"正在思考..."状态
            showThinking();

            // 模拟 AI 回复（实际由 Coze SDK 处理）
            setTimeout(() => {
                removeThinking();
                addMessage('您好！我是 AI 聊天助手，请问有什么可以帮您？', false);
                sendButton.disabled = false;
                sendButton.textContent = '发送';
            }, 1000);
        }

        // ============================================================
        // 初始化
        // ============================================================
        function initChat() {
            // 添加默认欢迎消息
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'message ai-message';
            welcomeDiv.innerHTML = `
                <div class="message-sender">AI 助手</div>
                <div class="message-content">你好！我是 AI 助手，请问有什么可以帮您？</div>
                <div class="message-time">${getCurrentTime()}</div>
            `;
            chatMessages.appendChild(welcomeDiv);

            // 发送按钮点击事件
            sendButton.addEventListener('click', sendMessage);
            
            // 输入框回车键事件
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // 输入框输入事件
            messageInput.addEventListener('input', () => {
                sendButton.disabled = !messageInput.value.trim();
            });
            
            // 初始禁用发送按钮
            sendButton.disabled = true;
        }

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            createStars();
            updateCursorLight();
            initChat();
            
            // 初始化 Coze 聊天窗口
            new CozeChatSDK.Chat({
                botId: '7634906073757319183',
                title: 'AI 聊天助手',
                container: document.getElementById('coze-chat-container'),
                layout: 'pc',
                width: '100%',
                login: false,
            });
            
            console.log('%c🤖 AI 聊天已启动', 'color: #4a9eff; font-size: 18px; font-weight: bold;');
        });

        // 空格键添加星星效果
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && document.activeElement !== messageInput) {
                const starsContainer = document.getElementById('stars');
                for (let i = 0; i < 10; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    
                    const size = Math.random() * 3 + 1;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.animationDelay = `${Math.random() * 5}s`;
                    star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                    
                    starsContainer.appendChild(star);
                    
                    setTimeout(() => {
                        if (star.parentNode) star.parentNode.removeChild(star);
                    }, 3000);
                }
            }
        });
    </script>
</body>
</html>
