<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 - 徐勇</title>
    <style>
        /* ============================================================
               基础重置
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a4a 25%, #0c0c3a 50%, #1a1a4a 75%, #0a0a2a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================================
           星空背景
           ============================================================ */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ============================================================
           页面标题
           ============================================================ */
        .page-header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
            z-index: 1;
        }

        .page-title {
            font-size: 2.8rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 20px rgba(100, 150, 255, 0.5), 0 0 40px rgba(100, 150, 255, 0.3);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.3);
        }

        /* ============================================================
           Coze 聊天容器
           ============================================================ */
        #coze-chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            margin: 20px auto 40px;
            border-radius: 16px;
            box-shadow:
                0 0 30px rgba(100, 150, 255, 0.15),
                0 0 60px rgba(100, 150, 255, 0.08),
                inset 0 0 30px rgba(100, 150, 255, 0.05);
            position: relative;
            z-index: 1;
            overflow: hidden;
            border: 1px solid rgba(100, 150, 255, 0.15);
        }

        /* ============================================================
           响应式适配
           ============================================================ */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
            }

            .page-subtitle {
                font-size: 0.85rem;
            }

            #coze-chat-container {
                max-width: 95%;
                height: 500px;
                border-radius: 12px;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .page-subtitle {
                font-size: 0.75rem;
            }

            #coze-chat-container {
                height: 400px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    星空背景
    ============================================================ -->
    <div id="stars"></div>

    <!-- ============================================================
    页面标题
    ============================================================ -->
    <header class="page-header">
        <h1 class="page-title">AI 聊天</h1>
        <p class="page-subtitle">由徐勇构建 · 基于 Coze 智能体</p>
    </header>

    <!-- ============================================================
    Coze 聊天容器
    ============================================================ -->
    <div id="coze-chat-container"></div>

    <!-- ============================================================
    JavaScript
    ============================================================ -->
    <script>
        // ============================================================
        // 1. 星空效果
        // ============================================================
        function createStars() {
            var starsContainer = document.getElementById('stars');
            var starCount = 150;

            for (var i = 0; i < starCount; i++) {
                var star = document.createElement('div');
                star.className = 'star';

                var size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';

                starsContainer.appendChild(star);
            }
        }

        // ============================================================
        // 2. 动态加载 Coze SDK 并初始化
        // ============================================================
        function initCozeChat() {
            const container = document.getElementById('coze-chat-container');
            if (!container) {
                console.error('❌ 找不到 coze-chat-container 容器');
                return;
            }

            const script = document.createElement('script');
            // 备用CDN地址：sf-cdn.coze.cn
            script.src = 'https://lf3-cdn.coze.cn/obj/univer-cn/coze-sdk/v1.1.0/chat-sdk.min.js';
            
            script.onload = function() {
                try {
                    new CozeChatSDK.Chat({
                        botId: '7634906073757319183',
                        title: 'AI 聊天助手',
                        container: container,
                        layout: 'pc',
                        width: '100%',
                        login: false,
                    });
                    console.log('✅ AI 聊天已成功启动');
                } catch (error) {
                    console.error('❌ Coze 初始化失败：', error);
                    document.getElementById('coze-chat-container').innerHTML = 
                        '<p style="color:white;text-align:center;padding-top:200px;">聊天组件加载失败，请刷新页面重试</p>';
                }
            };

            script.onerror = function() {
                console.error('❌ Coze SDK 加载失败，请检查网络');
                document.getElementById('coze-chat-container').innerHTML = 
                    '<p style="color:white;text-align:center;padding-top:200px;">聊天服务暂时加载失败，请稍后刷新重试</p>';
            };

            document.head.appendChild(script);
        }

        // ============================================================
        // 3. 页面加载完成后启动
        // ============================================================
        window.addEventListener('load', function() {
            createStars();
            initCozeChat();
        });
    </script>

</body>
</html>
